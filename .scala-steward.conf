# Stay on the Scala 3 LTS line (3.3.x)
updates.pin = [
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.3." },
  { groupId = "org.scala-lang", artifactId = "scala3-compiler", version = "3.3." }
]

# Since Scala 3.8, scala-library is published with Scala 3 versions too.
# Keep scala-library (used here for Scala 2.12 / 2.13) on the 2.x line.
updates.ignore = [
  { groupId = "org.scala-lang", artifactId = "scala-library", version = "3." }
]
